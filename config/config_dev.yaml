# Development environment configuration.
# Non-secret settings live here; secrets (mongo_uri with credentials, jwt
# secret) are provided by config/secret_dev.go.
environment: dev

server:
  port: "8080"
  grpc_port: "50051"
  # Behind a reverse proxy / docker NAT? set trust_proxy: true and list the
  # proxy addresses below so login rate limiting sees the real client IP.
  trust_proxy: false
  trusted_proxies: []

database:
  name: userdb
  # Overridden by secret_dev.go / the MONGO_URI env var when present.
  mongo_uri: ""

jwt:
  secret: ""