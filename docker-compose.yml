services:
  api:
    build: .
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      PORT: "8080"
      GRPC_PORT: "50051"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "userdb"
      JWT_SECRET: "${JWT_SECRET:-sup3r-s3cret-change-me}"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mongo-data: