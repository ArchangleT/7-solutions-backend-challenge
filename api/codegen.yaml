# oapi-codegen configuration (v2.8.0) - run via `make codegen`.
# Generates the Fiber server interface, request/response models and the
# embedded OpenAPI spec from api/openapi.yaml into the http inbound package.
package: http
output: internal/adapter/inbound/http/server_openapi.gen.go
generate:
  models: true
  fiber-server: true
  embedded-spec: true